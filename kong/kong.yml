_format_version: "3.0"
_transform: true

services:
  - name: paylock-service
    url: http://paylock:8080
    routes:
      - name: paylock-api-route
        paths:
          - /api
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS

plugins:
  - name: rate-limiting
    service: paylock-service
    config:
      minute: 120
      policy: local
