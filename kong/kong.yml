_format_version: "3.0"
_transform: true

services:
  - name: paylock-service
    url: http://paylock:8080
    routes:
      - name: auth-route
        paths:
          - /api/v1/auth
        strip_path: false
        regex_priority: 1

      - name: registration-route
        paths:
          - /api/v1/users
        methods:
          - POST
        strip_path: false
        regex_priority: 1

      # Public events route: add specific route so Kong matches it before the generic /api route
      - name: public-events-route
        paths:
          - /api/v1/events
          - /api/v1/events/*/availability
        methods:
          - GET
        strip_path: false
        regex_priority: 1

      - name: protected-route
        paths:
          - /api
        strip_path: false

consumers:
  - username: paylock-client
    jwt_secrets:
      - key: paylock-client
        secret: "9hucogN6halWRWBSZ4TRLEAIzRhucogN6haaSyCAHs1nlWR_1nlWRucogN6ha1nk2j"
        algorithm: HS256

plugins:
  # JWT only on protected route
  - name: jwt
    route: protected-route
    config:
      secret_is_base64: false
      key_claim_name: iss

  # rate-limiting attached to the service
  - name: rate-limiting
    service: paylock-service
    config:
      minute: 120
      policy: redis
      redis:
        host: redis
        port: 6379
      limit_by: consumer

  - name: proxy-cache
    route: public-events-route
    config:
      strategy: memory
      cache_ttl: 60
      request_method:
        - GET

  - name: request-size-limiting
    config:
      allowed_payload_size: 10

  - name: http-log
    config:
      http_endpoint: http://logstash:5001
      method: POST