services:
  mysql:
    image: mysql:8.0
    container_name: paylock-mysql
    platform: linux/amd64
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_NAME:-paylock}
      MYSQL_USER: ${DB_USER:-paylock}
      MYSQL_PASSWORD: ${DB_PASSWORD:-paylock}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-paylock}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - paylock-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  paylock:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: paylock-app
    platform: linux/amd64
    restart: unless-stopped
    environment:
      SPRING_R2DBC_URL: r2dbc:mysql://mysql:3306/${DB_NAME:-paylock}?sslMode=DISABLED
      SPRING_R2DBC_USERNAME: ${DB_ROOT_USER:-root}
      SPRING_R2DBC_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      APP_JWT_SECRET: ${JWT_SECRET}
      app.jwt.secret: ${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - paylock-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kong:
    image: kong:3.8
    container_name: paylock-kong
    platform: linux/amd64
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro
    depends_on:
      - paylock
      - redis
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    expose:
      - "8000"
      - "8001"
    networks:
      - paylock-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: paylock-nginx
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      kong:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-8088}:80"
      - "443:443"
    networks:
      - paylock-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: paylock-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - paylock-network

  prometheus:
    image: prom/prometheus:latest
    container_name: paylock-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - paylock-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: paylock-elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - paylock-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: paylock-logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5001:5001"
    networks:
      - paylock-network
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: paylock-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=true
      - xpack.security.enrollment.enabled=true
    ports:
      - "5601:5601"
    networks:
      - paylock-network
    depends_on:
      - elasticsearch

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  esdata:
    driver: local

networks:
  paylock-network:
    driver: bridge
