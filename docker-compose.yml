services:
  mysql:
    image: mysql:8.0
    container_name: paylock-mysql
    platform: linux/amd64
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_NAME:-paylock}
      MYSQL_USER: ${DB_USER:-paylock}
      MYSQL_PASSWORD: ${DB_PASSWORD:-paylock}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-paylock}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - paylock-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  paylock:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: paylock-app
    platform: linux/amd64
    restart: unless-stopped
    environment:
      SPRING_R2DBC_URL: r2dbc:mysql://mysql:3306/${DB_NAME:-paylock}?sslMode=DISABLED
      SPRING_R2DBC_USERNAME: ${DB_ROOT_USER:-root}
      SPRING_R2DBC_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      APP_JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      disable: true
    expose:
      - "8080"
    networks:
      - paylock-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kong:
    image: kong:3.8
    container_name: paylock-kong
    platform: linux/amd64
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro
    depends_on:
      - paylock
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    expose:
      - "8000"
      - "8001"
    networks:
      - paylock-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: paylock-nginx
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      kong:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-8088}:80"
    networks:
      - paylock-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data:
    driver: local

networks:
  paylock-network:
    driver: bridge
