spring.application.name=paylock
server.port=8080

# R2DBC MySQL
spring.r2dbc.url=r2dbc:mysql://mysql:3306/paylock?sslMode=DISABLED&allowPublicKeyRetrieval=true
spring.r2dbc.username=paylock
spring.r2dbc.password=paylock
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20
spring.r2dbc.pool.max-idle-time=30m

# Standard headers
app.headers.request-ref-id=X-Request-Ref-Id
app.headers.organization=X-Organization
app.headers.channel=X-Channel
app.headers.user-id=X-User-Id

# Logging
logging.level.org.springframework.r2dbc=INFO
logging.level.reactor.netty.http.server=INFO

lock.threshold.percent=30
cancellation.fee.percent=5
expiry.check.interval=PT5M

logging.pattern.console = ${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}


