name: Build, Test, and Docker

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'corretto'
        cache: maven

    - name: Build with Maven
      run: ./mvnw clean package -DskipTests

    - name: Run Tests
      run: ./mvnw test

    - name: Upload test coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: jacoco-coverage
        path: target/site/jacoco/

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'corretto'
        cache: maven

    - name: Build application JAR
      run: ./mvnw clean package -DskipTests

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: paylock:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image with compose
      env:
        DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD || 'password' }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'paylock' }}
        DB_NAME: ${{ secrets.DB_NAME || 'paylock' }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
      run: |
        docker compose up -d
        sleep 30
        docker compose exec -T paylock wget -qO- http://localhost:8080/actuator/health || exit 1
        docker compose logs
        docker compose down -v

  docker-push:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'corretto'
        cache: maven

    - name: Build application JAR
      run: ./mvnw clean package -DskipTests

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/paylock:latest
          ${{ secrets.DOCKER_USERNAME }}/paylock:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
